# Every new issue gets needs-triage, so nothing skips the queue: the issue forms add it, and this catches an issue opened
# any other way. An issue stays open until someone decides it.
name: Triage label

on:
  issues:
    types: [opened]

permissions: {}

jobs:
  label:
    runs-on: ubuntu-latest
    permissions:
      issues: write
    steps:
      - name: Add needs-triage
        run: gh issue edit "$NUMBER" --add-label needs-triage
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          NUMBER: ${{ github.event.issue.number }}
